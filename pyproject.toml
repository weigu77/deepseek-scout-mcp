[project]
name = "deepseek-scout-mcp"
version = "0.1.7"
description = "FastMCP server wrapping DeepSeek's Search and Fetch APIs"
readme = "README.md"
authors = [
    { name = "weigu77", email = "3444567034@qq.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/weigu77/deepseek-scout-mcp"
Repository = "https://github.com/weigu77/deepseek-scout-mcp"
Issues = "https://github.com/weigu77/deepseek-scout-mcp/issues"

[project.scripts]
deepseek-scout-mcp = "deepseek_scout_mcp:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_scout_mcp"]



